<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>PLAY ROCK PAPER SCISSORS</h1>
        <p>choose your weapon</p>
    </div>

    <div class="content">
        <div class="cards">
            <div class="card" id="rock">
                <div class="image">
                    <img src="images/rock.png" alt="">
                </div>
                <h3>ROCK</h3>
                <button class="select" id="rock">choose</button>
            </div>        
            <div class="card" id="paper">
                <div class="image">
                    <img src="images/paper.png" alt="">
                </div>
                <h3>PAPER</h3>
                <button class="select" id="paper">choose</button>
            </div>        
            <div class="card" id="scissors">
                <div class="image">
                    <img src="images/scissors.png" alt="">
                </div>
                <h3>SCISSORS</h3>
                <button class="select" id="scissors">choose</button>
            </div>
        </div>
        <div class="log">
            <h1>SCORE</h3>
            <div class="score-container">
                <h3>HUMAN : </h3>
                <span id="pscore">0</span>
            </div>
            <div class="score-container">
                <h3>COMPUTER : </h3>
                <span id="cscore">0</span>
            </div>
            <ul id="log"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
