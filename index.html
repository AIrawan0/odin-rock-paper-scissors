<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>PLAY ROCK PAPER SCISSORS</h1>
        <p>choose your weapon</p>
    </div>

    <div class="content">
        <div class="cards">
            <div class="card" id="rock">
                <div class="image"></div>
                <h3>ROCK</h3>
                <button class="rock" id="rock">choose</button>
            </div>        
            <div class="card" id="paper">
                <div class="image"></div>
                <h3>PAPER</h3>
                <button class="paper" id="paper">choose</button>
            </div>        
            <div class="card" id="scissors">
                <div class="image"></div>
                <h3>SCISSORS</h3>
                <button class="scissors" id="scissors">choose</button>
            </div>
        </div>
        <div class="log">
            <h2>RESULT</h2>
            <ul id="result"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
